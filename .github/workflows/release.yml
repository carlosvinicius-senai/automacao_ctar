name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Automacao_CTAR.exe
        run: python build_exe.py

      - name: Build Setup_Automacao_CTAR.exe
        run: python build_setup.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Setup_Automacao_CTAR.exe dist/Automacao_CTAR.exe --title "${{ github.ref_name }}" --generate-notes
